[package]
name = "quickbench-macros"
version = "0.1.1"
edition = "2024"
description = "Proc-macro crate for quickbench. Provides #[quick_bench]."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xxorza/quickbench"
keywords = ["benchmark", "macro", "proc-macro"]
categories = ["development-tools::testing"]
exclude = ["AGENTS.md", "CLAUDE.md"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate where it appears.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load.
cast_ptr_alignment = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
items_after_test_module = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
self_named_module_files = "warn"
todo = "warn"
unused_result_ok = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
